<!DOCTYPE html>
<html lang="{{ config.language.split('-')[0] }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ config.title }}{% endblock %}</title>
<meta name="description" content="{% block description %}{{ config.description }}{% endblock %}">
<link rel="alternate" type="application/rss+xml" title="{{ config.title }}" href="{{ root }}feed.xml">
{% if canonical %}<link rel="canonical" href="{{ canonical }}">{% endif %}
<link rel="icon" href="{{ root }}{{ config.logo_image or config.cover_image }}">
<link rel="stylesheet" href="{{ root }}assets/styles.css">
</head>
<body>
<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="{{ root }}">
      <img class="brand-cover" src="{{ root }}{{ config.logo_image or config.cover_image }}" alt="">
      <span>{{ config.title }}</span>
    </a>
  </div>
</header>
<main class="container">
{% block content %}{% endblock %}
</main>
<footer class="site-footer">
  <div class="container">
    <p>{% if config.copyright %}{{ config.copyright }}{% else %}&copy; {{ year }} {{ config.author or config.title }}{% endif %}</p>
  </div>
</footer>
</body>
</html>
