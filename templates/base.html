<!DOCTYPE html>
<html lang="{{ config.language.split('-')[0] }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ config.title }}{% endblock %}</title>
<meta name="description" content="{% block description %}{{ config.description }}{% endblock %}">
<link rel="alternate" type="application/rss+xml" title="{{ config.title }}" href="{{ root }}feed.xml">
<link rel="icon" href="{{ root }}assets/cover.png">
<link rel="stylesheet" href="{{ root }}assets/styles.css">
</head>
<body>
<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="{{ root }}">
      <img class="brand-cover" src="{{ root }}assets/cover.png" alt="">
      <span>{{ config.title }}</span>
    </a>
    <nav>
      <a class="feed-link" href="{{ root }}feed.xml" title="RSS feed">RSS&nbsp;Feed</a>
    </nav>
  </div>
</header>
<main class="container">
{% block content %}{% endblock %}
</main>
<footer class="site-footer">
  <div class="container">
    <p>&copy; {{ year }} {{ config.author or config.title }}{% if config.copyright %} &middot; {{ config.copyright }}{% endif %}</p>
    <p><a href="{{ root }}feed.xml">Subscribe via RSS</a></p>
  </div>
</footer>
</body>
</html>
